name: Tests

on:
  push:
    branches: [main, develop, development]
  pull_request:
    branches: [main, develop, development]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm 12 and Node.js 22
        uses: pnpm/setup@v3
        with:
          runtime: node@22
          cache: true
          require-lockfile: true

      - name: Run API linter
        run: pnpm --filter vubatype-be lint

      - name: Run API unit tests
        run: pnpm --filter vubatype-be test:cov

      - name: Run API e2e tests
        run: pnpm --filter vubatype-be test:e2e

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./apps/api/coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm 12 and Node.js 22
        uses: pnpm/setup@v3
        with:
          runtime: node@22
          cache: true
          require-lockfile: true

      - name: Lint web
        run: pnpm --filter vubatype-ui lint

      - name: Build applications
        run: pnpm build

      - name: Check API build output
        run: test -d apps/api/dist
