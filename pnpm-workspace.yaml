packages:
  - "apps/*"
  - "packages/*"

# pnpm 12 ignores dependency build scripts unless they are approved here.
allowBuilds:
  bcrypt: true
  unrs-resolver: true
  "@scarf/scarf": false

# No patched release is available. Remove an entry when one is published.
# GHSA-vfj7-8cjw-p6xm: braces, high, via ESLint and Jest.
# GHSA-hp3w-g68c-fv3c: sprintf-js, moderate.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-hp3w-g68c-fv3c

minimumReleaseAgeExclude:
  - "@nestjs/cli@12.0.10"
